<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Yashasvi Singh Rathore — Backend Engineer, Go, PostgreSQL, Redis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="55%" stop-color="#0a1420"/>
      <stop offset="100%" stop-color="#06101a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#7CE3FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#00ADD8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="16"/></clipPath>
  </defs>

  <style>
    .name   { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; }
    .sub    { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 400; }
    .mono   { font-family: "SFMono-Regular", "Fira Code", Consolas, monospace; }
    .line   { opacity: 0; animation: cyc 12s infinite ease-in-out; }
    .l1 { animation-delay: 0s; } .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; }
    @keyframes cyc { 0%, 2% { opacity: 0 } 6%, 28% { opacity: 1 } 33%, 100% { opacity: 0 } }
    .caret { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: .9 } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle cx="1010" cy="120" r="240" fill="url(#glow)"/>

    <!-- accent edge -->
    <rect x="0" y="0" width="6" height="260" fill="url(#accent)"/>

    <!-- name -->
    <text class="name" x="58" y="92" font-size="42" fill="#E6EDF3" letter-spacing="1.5">Yashasvi Singh Rathore</text>
    <rect x="60" y="108" width="132" height="4" rx="2" fill="url(#accent)"/>

    <!-- role -->
    <text class="sub" x="60" y="146" font-size="17" fill="#8b949e">Backend Engineer &#183; Go &#183; PostgreSQL &#183; Redis</text>

    <!-- animated terminal line -->
    <text class="mono" x="60" y="196" font-size="14.5" fill="#00ADD8">$</text>
    <text class="mono line l1" x="80" y="196" font-size="14.5" fill="#c9d1d9">REST and WebSocket services in Go<tspan class="caret" fill="#00ADD8" dx="4">&#9612;</tspan></text>
    <text class="mono line l2" x="80" y="196" font-size="14.5" fill="#c9d1d9">cache-aside leaderboards on Redis + PostgreSQL<tspan class="caret" fill="#00ADD8" dx="4">&#9612;</tspan></text>
    <text class="mono line l3" x="80" y="196" font-size="14.5" fill="#c9d1d9">state that stays correct under concurrency<tspan class="caret" fill="#00ADD8" dx="4">&#9612;</tspan></text>

    <!-- right-side pipeline -->
    <g transform="translate(0,0)">
      <line x1="900" y1="120" x2="1120" y2="120" stroke="#00ADD8" stroke-opacity="0.3" stroke-width="2"/>

      <circle cx="900" cy="120" r="26" fill="#0d1b2a" stroke="#00ADD8" stroke-opacity="0.65" stroke-width="2"/>
      <circle cx="1010" cy="120" r="26" fill="#0d1b2a" stroke="#00ADD8" stroke-opacity="0.65" stroke-width="2"/>
      <circle cx="1120" cy="120" r="26" fill="#0d1b2a" stroke="#00ADD8" stroke-opacity="0.65" stroke-width="2"/>

      <circle class="pulse" cx="900" cy="120" r="34" fill="none" stroke="#00ADD8" stroke-opacity="0.25"/>

      <text class="mono" x="900" y="125" font-size="11" fill="#7CE3FF" text-anchor="middle">API</text>
      <text class="mono" x="1010" y="125" font-size="11" fill="#7CE3FF" text-anchor="middle">cache</text>
      <text class="mono" x="1120" y="125" font-size="11" fill="#7CE3FF" text-anchor="middle">db</text>

      <text class="mono" x="1010" y="178" font-size="10.5" fill="#6e7681" text-anchor="middle">read path &#183; write path</text>

      <circle r="4.5" cy="120" fill="#7CE3FF">
        <animate attributeName="cx" values="900;1120;900" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0" y="256" width="1200" height="4" fill="url(#accent)" opacity="0.7"/>
  </g>
</svg>
